<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Panel | Montajes Sur</title>

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos del Administrador -->
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <img src="IMG/Montaje Sur LOGO.png" alt="Montajes Sur" class="login-logo">
            <h1 class="login-title">Panel de Administración</h1>
            <p class="login-subtitle">Ingresá con tus credenciales autorizadas</p>
        </div>

        <form id="login-form" class="admin-form">
            <div id="login-error" class="alert-box alert-error" style="display: none;"></div>

            <div class="form-group">
                <label for="email" class="form-label">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="ejemplo@correo.com" 
                    required 
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="login-btn" class="btn-primary-blue w-100">
                <span id="login-btn-text">Iniciar Sesión</span>
                <span id="login-btn-spinner" class="spinner" style="display: none;"></span>
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver al sitio web principal
            </a>
        </div>
    </div>

    <!-- Supabase JS Client y Conexión -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        // Si el usuario ya tiene sesión activa, redirigir automáticamente al panel
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) return;

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
                return;
            }

            const loginForm = document.getElementById('login-form');
            const errorBox = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');
            const btnText = document.getElementById('login-btn-text');
            const btnSpinner = document.getElementById('login-btn-spinner');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                // Animación de carga
                loginBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-block';

                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    errorBox.textContent = 'Error al iniciar sesión: ' + (error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message);
                    errorBox.style.display = 'block';

                    loginBtn.disabled = false;
                    btnText.style.display = 'inline-block';
                    btnSpinner.style.display = 'none';
                } else if (data.session) {
                    window.location.href = 'admin.html';
                }
            });
        });
    </script>
</body>
</html>
